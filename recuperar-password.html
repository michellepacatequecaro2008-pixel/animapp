<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Animapp</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- ENCABEZADO SIMPLE -->
    <header class="encabezado-simple">
        <a href="index.html" class="logo-nombre">
            <img src="/imagenes/logoanimapp.png" alt="Logo Animapp" class="logo-img">
            <h1>Animapp</h1>
        </a>
    </header>

    <!-- FORMULARIO DE RECUPERACIÓN -->
    <main class="formulario-contenedor">
        <h2>¿Olvidaste tu contraseña?</h2>
        <p>Ingresa tu correo electrónico registrado y te enviaremos las instrucciones para restablecer tu cuenta.</p>

        <!-- Mensaje dinámico para alertas -->
        <div id="mensaje-alerta" class="alerta" style="display: none;"></div>

        <form id="form-recuperar" action="#" method="post" class="formulario" novalidate>
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com">

            <button type="submit" class="btn btn-verde">Enviar enlace de recuperación</button>
        </form>

        <p><a href="login.html">Volver al Inicio de sesión</a></p>
    </main>

    <!-- PIE DE PÁGINA INSTITUCIONAL -->
    <footer class="pie">
        <div class="info-contacto">
            <p><strong>Animapp</strong></p>
            <address>
                <p>Localidad de Engativá, Bogotá D.C.</p>
                <p>Contacto: info@alfortanimalcare.com | Tel: 300 123 4567</p>
            </address>
        </div>
        <div class="ubicacion-mapa">
            <a href="https://maps.google.com/?q=Engativa,Bogota" target="_blank" rel="noopener noreferrer">Ver ubicación en Google Maps</a>
        </div>
    </footer>

    <!-- SCRIPT DE VALIDACIÓN -->
    <script src="js/recuperar-password.js"></script>

</body>
</html>
